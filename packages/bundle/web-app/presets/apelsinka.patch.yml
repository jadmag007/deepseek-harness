# Agent preset apelsinka: the Apelsinka edition default — the keeper of the
# complex (Orange Pi Zero 2W behind jadmag.ru) speaks Russian to the owner.
#
# It is the `cordis` baseline minus the unbranded creator tooling plus the
# complex's own toolset, so the edition ships with the same agent the profile
# has been running.
#
# ВАЖНО: `plugins` — это ПОЛНЫЙ состав изолированного поддерева агента, а не
# дельта профиля: забытая строка означает, что инструмента просто не будет.
# Список собран из живого состава профиля.
#
# The `@local/*` rows ship as profile bundles (dsh-plugins), not as workspace
# packages, so `verify-runtime-closure` exempts this preset from runtime
# closure for that scope: a session mounting `apelsinka` in a profile without
# those bundles installed fails loud rather than starting half-armed.
#
# Что убрано из `cordis` и почему:
#   tool-cordis               — небрендированный инспектор Cordis; заменён
#                               apelsinka_forge / apelsinka_forge_check;
#   tool-subagent-codex       — выключен и не используется (провайдер codex);
#   tool-subagent-claude-code — то же (провайдер claude-code);
#   tool-ralph                — выключен, цикла нам не нужно;
#   tool-bash                 — остаётся выключенным на Windows: bash в PATH там
#                               заглушка WSL, плату берём через apelsinka_board.
- insert:
    - id: preset-apelsinka
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: apelsinka
        name: Апельсинка
        description: >-
          Хранитель комплекса на Orange Pi: плата, реестр приложений, версии и
          деплой. Инструменты комплекса подключены обязательно.
        order: 5

        plugins:
          # ── Личность ──────────────────────────────────────────────────────────
          # Только короткая роль. Полные правила приходят файлом через
          # agent-instructions: дублировать их здесь означало бы держать одно и
          # то же в двух местах и платить за это токенами в каждом запросе.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are the keeper of the Apelsinka complex — an Orange Pi Zero 2W
                running several applications behind jadmag.ru. You speak Russian to
                the owner and keep the server, the core and the data safe.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 262144

          # ── Инструменты работы с машиной ───────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── Навыки ─────────────────────────────────────────────────────────────
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── План, цели, задачи ────────────────────────────────────────────────
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'

          # ── Делегирование и веб ───────────────────────────────────────────────
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── Сжатие контекста ──────────────────────────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── Инструменты комплекса: обязательные ────────────────────────────────
          # Плата и ядро
          - id: apelsinka-status
            name: '@local/apelsinka-status'
          - id: apelsinka-board
            name: '@local/apelsinka-board'
          - id: apelsinka-board-file
            name: '@local/apelsinka-board-file'
          - id: apelsinka-caddy
            name: '@local/apelsinka-caddy'
          # Доставка и здоровье
          - id: apelsinka-deploy
            name: '@local/apelsinka-deploy'
          - id: apelsinka-drift
            name: '@local/apelsinka-drift'
          - id: apelsinka-smoke
            name: '@local/apelsinka-smoke'
          # Дисциплина работы
          - id: apelsinka-release
            name: '@local/apelsinka-release'
          - id: apelsinka-versioning
            name: '@local/apelsinka-versioning'
          - id: apelsinka-handoff
            name: '@local/apelsinka-handoff'
          - id: apelsinka-memory
            name: '@local/apelsinka-memory'
          # Собственные инструменты против штатных
          - id: apelsinka-plugin-forge
            name: '@local/apelsinka-plugin-forge'
          - id: openrouter-balance
            name: '@local/openrouter-balance'

          # ── Управление плагинами ──────────────────────────────────────────────
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"